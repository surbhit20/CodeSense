<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1a; overflow: hidden; font-family: sans-serif; }
    #graph { width: 100vw; height: 100vh; transition: opacity 0.15s ease; }
    #graph.busy { opacity: 0.5; pointer-events: none; }
    #hint {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      color: #6b7280; font-size: 13px; text-align: center;
      pointer-events: none; transition: opacity 0.2s ease;
    }
    #hint.hidden { opacity: 0; }
    #hint svg { opacity: 0.6; }

    #controls {
      position: absolute; top: 12px; right: 12px;
      display: flex; flex-direction: column; gap: 4px;
      z-index: 10;
    }
    #controls button {
      width: 26px; height: 26px;
      background: #24272d; border: 1px solid #3a3f47; border-radius: 5px;
      color: #aab0ba; font-size: 14px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }
    #controls button:hover {
      background: hsl(217.2 91.2% 59.8% / 0.16);
      border-color: hsl(217.2 91.2% 59.8% / 0.6);
      color: #eaf1ff;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <div id="graph"></div>
  <div id="hint">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M9 3v4a1 1 0 0 1-1 1H4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 3h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9M9 3L4 8v11a2 2 0 0 0 2 2h5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13 13h4M13 17h4" stroke-linecap="round"/>
    </svg>
    <span>Click a folder to expand it, or a file to analyze it</span>
  </div>
  <div id="controls">
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="zoomOut" title="Zoom out">−</button>
    <button id="zoomReset" title="Fit to view">⤢</button>
  </div>
  <script>
    let network = null;
    let busy = false;

    // Full dataset from Python, keyed by id — the source of truth for
    // what *could* be shown. allNodes/allEdges (the vis DataSets) hold only
    // what's currently visible.
    let nodeById = new Map();
    let childrenOf = new Map();
    let parentOf = new Map();
    let expandedDirs = new Set();

    // How many of a directory's children are currently revealed. A folder
    // with more than PAGE_SIZE children doesn't dump all of them at once —
    // huge repos (hundreds of siblings) turned that into an unreadable fan
    // of unlabeled boxes regardless of layout. Paginate instead: show a
    // "+N more" node that reveals the next batch on click, independent of
    // how big the underlying repo is.
    const PAGE_SIZE = 10;
    let visibleCount = new Map();

    let allNodes = new vis.DataSet([]);
    let allEdges = new vis.DataSet([]);

    const DIR_COLLAPSED = {
      background: '#333a44', border: 'hsl(217.2 91.2% 59.8% / 0.55)',
      highlight: { background: '#3a4250', border: 'hsl(217.2 91.2% 59.8%)' },
      hover: { background: '#383f4a', border: 'hsl(217.2 91.2% 59.8% / 0.75)' },
    };
    const DIR_EXPANDED = {
      background: '#262b33', border: 'hsl(217.2 91.2% 59.8% / 0.3)',
      highlight: { background: '#3a4250', border: 'hsl(217.2 91.2% 59.8%)' },
      hover: { background: '#2e3440', border: 'hsl(217.2 91.2% 59.8% / 0.5)' },
    };
    const FILE_COLOR = {
      background: '#20242b', border: 'hsl(217.2 91.2% 59.8% / 0.22)',
      highlight: { background: '#3b82f6', border: '#dbeafe' },
      hover: { background: '#262b33', border: 'hsl(217.2 91.2% 59.8% / 0.45)' },
    };
    // Deliberately duller and dashed — this isn't a real file or folder, it's
    // a "reveal more" control, and it needs to read as clearly different so
    // it's never mistaken for actual repo content.
    const MORE_COLOR = {
      background: '#1c1f24', border: '#4a5160',
      highlight: { background: '#262b33', border: '#6b7280' },
      hover: { background: '#22262c', border: '#5a6270' },
    };

    function dirLabel(node) {
      const arrow = expandedDirs.has(node.id) ? '▾' : '▸';
      return `${arrow} ${node.label}`;
    }

    function moreNodeId(dirId) {
      return `__more__:${dirId}`;
    }

    function moreEdgeId(dirId) {
      return `${dirId}->${moreNodeId(dirId)}`;
    }

    function toMoreVisNode(dirId, remaining) {
      const parentDepth = nodeById.get(dirId)?.depth ?? 0;
      return {
        id: moreNodeId(dirId),
        label: `+ ${remaining} more`,
        shape: 'box',
        // Same level as the real siblings it stands in for — otherwise it's
        // just as exposed to the leaf-alignment issue toVisNode's `level`
        // fixes for everything else.
        level: parentDepth + 1,
        color: MORE_COLOR,
        font: { color: '#8a93a6', size: 12, face: 'monospace' },
        borderWidth: 1,
        borderDashes: [4, 3],
        margin: 8,
      };
    }

    function toVisNode(node) {
      const isDir = node.group === 'dir';
      return {
        id: node.id,
        label: isDir ? dirLabel(node) : node.label,
        title: node.title,
        group: node.group,
        // Without an explicit level, vis's hierarchical layout infers one
        // per node from the edges — and its inference pulls leaf nodes
        // (no children currently shown) down to align with whatever the
        // deepest visible branch is. On a repo with uneven nesting depth
        // (a shallow top level next to one folder that goes 5+ levels
        // deep) that dragged root's ordinary shallow children down to sit
        // beside a totally unrelated branch's files. We already compute
        // real tree depth server-side — pin it explicitly instead of
        // trusting the heuristic.
        level: node.depth ?? 0,
        color: isDir ? (expandedDirs.has(node.id) ? DIR_EXPANDED : DIR_COLLAPSED) : FILE_COLOR,
        font: isDir
          ? { color: '#f2f4f7', size: 15, face: 'monospace', bold: { color: '#f2f4f7' } }
          : { color: '#aab0ba', size: 12.5, face: 'monospace' },
        shape: 'box',
        borderWidth: isDir ? 1.5 : 1,
        margin: isDir ? 10 : 8,
      };
    }

    function edgeSpec(e) {
      return {
        id: `${e.from}->${e.to}`,
        from: e.from,
        to: e.to,
        color: { color: '#3a3f47', highlight: '#5a6270', opacity: 0.7 },
        arrows: { to: { enabled: false } },
        smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.5 },
        width: 1,
      };
    }

    function refreshNode(id) {
      const node = nodeById.get(id);
      if (node && allNodes.get(id)) allNodes.update(toVisNode(node));
    }

    // network.fit() was landing the view off-center on small graphs (its
    // reported viewPosition after fitting turned out to be the raw canvas
    // center in pixels, not the node bounding box's center in world space)
    // — so compute the center/scale ourselves from actual node positions
    // instead of trusting it.
    function fitToNodes(animate) {
      // Also supersede any in-flight fitWhenReady() retry chain from an
      // earlier click — a direct caller (the reset button) always wins.
      fitToken++;
      const ids = allNodes.getIds();
      if (!ids.length || !network) return;
      const positions = network.getPositions(ids);
      const xs = Object.values(positions).map(p => p.x);
      const ys = Object.values(positions).map(p => p.y);
      const margin = 140;
      const boxW = Math.max(...xs) - Math.min(...xs) + margin;
      const boxH = Math.max(...ys) - Math.min(...ys) + margin;
      const container = document.getElementById('graph');
      const scale = Math.min(container.clientWidth / boxW, container.clientHeight / boxH, 1.4);
      // The container can still be mid-layout (0×0) right after the panel's
      // slide-in transition starts — moveTo() throws on a non-positive
      // scale, so skip rather than crash; fitWhenReady() below is what
      // actually waits for a valid size before calling this.
      if (!isFinite(scale) || scale <= 0) return;
      const position = {
        x: (Math.max(...xs) + Math.min(...xs)) / 2,
        y: (Math.max(...ys) + Math.min(...ys)) / 2,
      };
      network.moveTo({
        position,
        scale,
        animation: animate ? { duration: 350, easingFunction: 'easeInOutQuad' } : false,
      });
      // moveTo() doesn't emit vis's 'zoom' event (that's wheel/pinch only),
      // so the label-hide threshold needs a manual nudge here too. For an
      // animated move, wait for it to land before checking the final scale.
      if (animate) {
        setTimeout(applyLabelVisibility, 360);
      } else {
        applyLabelVisibility();
      }
    }

    // Two unrelated things can make an immediate fit wrong, both fixed by
    // waiting rather than measuring synchronously:
    //  1. The panel this graph lives in slides in via CSS transform, and
    //     the very first fit can land while that's still settling
    //     (container reports 0×0 for a frame or two).
    //  2. After a DataSet mutation (expand, collapse, "+more"), vis's
    //     hierarchical layout hasn't necessarily finished repositioning
    //     everything yet — fitting against getPositions() too early once
    //     measured a "+more" node's position as still off past the right
    //     edge of the container, from before the relayout had settled.
    // setTimeout, not requestAnimationFrame — rAF never fires while the tab
    // is backgrounded, which would strand this permanently if the panel
    // gets created while the user is on a different tab.
    //
    // On a huge repo it's normal to click through several folders in quick
    // succession, well within each other's fit delay/animation window —
    // without coalescing, each click's fit chain runs independently and
    // whichever happens to land last "wins", even if it started from an
    // earlier, now-stale node set. A token invalidates every in-flight
    // attempt from a previous call the moment a new one is requested, so
    // only the most recent click's fit ever actually runs.
    let fitToken = 0;

    function fitWhenReady(animate) {
      const myToken = ++fitToken;
      setTimeout(() => attemptFit(animate, myToken, 40), 30);
    }

    function attemptFit(animate, myToken, attemptsLeft) {
      if (myToken !== fitToken) return; // superseded by a newer request
      const container = document.getElementById('graph');
      if (container.clientWidth > 0 && container.clientHeight > 0) {
        fitToNodes(animate);
      } else if (attemptsLeft > 0) {
        setTimeout(() => attemptFit(animate, myToken, attemptsLeft - 1), 50);
      }
    }

    // Reveals the next page of dirId's children (the first page, if none
    // are shown yet). Safe to call repeatedly on an already-expanded
    // directory — that's exactly how the "+N more" node advances.
    function showChildren(dirId) {
      const kids = childrenOf.get(dirId) || [];
      const shown = visibleCount.get(dirId) || 0;
      const nextShown = Math.min(shown + PAGE_SIZE, kids.length);
      visibleCount.set(dirId, nextShown);

      const toShow = kids.slice(shown, nextShown);
      const nodesToAdd = toShow.filter(id => !allNodes.get(id)).map(id => toVisNode(nodeById.get(id)));
      const edgesToAdd = toShow
        .filter(id => !allEdges.get(`${dirId}->${id}`))
        .map(id => edgeSpec({ from: dirId, to: id }));

      // Drop the old "+more" node before deciding whether a new one is
      // needed — otherwise its count goes stale after the first page.
      if (allNodes.get(moreNodeId(dirId))) allNodes.remove(moreNodeId(dirId));
      if (allEdges.get(moreEdgeId(dirId))) allEdges.remove(moreEdgeId(dirId));

      const remaining = kids.length - nextShown;
      if (remaining > 0) {
        nodesToAdd.push(toMoreVisNode(dirId, remaining));
        edgesToAdd.push(edgeSpec({ from: dirId, to: moreNodeId(dirId) }));
      }

      if (nodesToAdd.length) allNodes.add(nodesToAdd);
      if (edgesToAdd.length) allEdges.add(edgesToAdd);
    }

    function hideDescendants(dirId) {
      const kids = childrenOf.get(dirId) || [];
      for (const childId of kids) {
        const child = nodeById.get(childId);
        if (child && child.group === 'dir' && expandedDirs.has(childId)) {
          expandedDirs.delete(childId);
          hideDescendants(childId);
        }
        if (allNodes.get(childId)) allNodes.remove(childId);
        const edgeId = `${dirId}->${childId}`;
        if (allEdges.get(edgeId)) allEdges.remove(edgeId);
      }
      if (allNodes.get(moreNodeId(dirId))) allNodes.remove(moreNodeId(dirId));
      if (allEdges.get(moreEdgeId(dirId))) allEdges.remove(moreEdgeId(dirId));
      visibleCount.delete(dirId);
    }

    // Keeps total visible complexity bounded to roughly one active
    // drill-down path — without this, a deep/wide repo (buck2: 535
    // directories, up to 12 levels deep) accumulates every branch a user
    // has ever clicked into over a session, and no amount of per-directory
    // pagination or layout tuning keeps *that* readable; the combined
    // bounding box ends up so lopsided (extremely wide, or extremely
    // tall, depending which branches happened to be open) that fitting it
    // shrinks the whole graph into an illegible sliver. Expanding a new
    // directory collapses any other expanded one that isn't one of its
    // own ancestors — the path leading to it stays open, unrelated
    // branches close, like a single-open accordion.
    function collapseUnrelated(dirId) {
      const ancestors = new Set();
      let cur = dirId;
      while (parentOf.has(cur)) {
        cur = parentOf.get(cur);
        ancestors.add(cur);
      }
      for (const expandedId of Array.from(expandedDirs)) {
        if (expandedId !== dirId && !ancestors.has(expandedId)) {
          expandedDirs.delete(expandedId);
          hideDescendants(expandedId);
          refreshNode(expandedId);
        }
      }
    }

    function toggleDir(dirId) {
      if (expandedDirs.has(dirId)) {
        expandedDirs.delete(dirId);
        hideDescendants(dirId);
      } else {
        collapseUnrelated(dirId);
        expandedDirs.add(dirId);
        showChildren(dirId);
      }
      refreshNode(dirId);
      fitWhenReady(true);
    }

    // Labels stop being legible under ~6px on screen; rather than let them
    // render as an unreadable smear, hide them entirely below that zoom and
    // bring them back once there's room to read them again.
    let labelsHidden = false;
    const LABEL_HIDE_SCALE = 0.45;

    function applyLabelVisibility() {
      const scale = network.getScale();
      const shouldHide = scale < LABEL_HIDE_SCALE;
      if (shouldHide === labelsHidden) return;
      labelsHidden = shouldHide;
      const updates = allNodes.get().map(n => {
        const node = nodeById.get(n.id);
        // "+more" nodes aren't in nodeById (they're synthetic, not real
        // repo entries) — fall back to their own current font instead of
        // building a fresh one from a node that doesn't exist.
        const base = node ? toVisNode(node) : { id: n.id, font: n.font };
        base.font = { ...base.font, size: shouldHide ? 0 : (node ? base.font.size : 12) };
        return base;
      });
      if (updates.length) allNodes.update(updates);
    }

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'setBusy') {
        busy = !!e.data.busy;
        document.getElementById('graph').classList.toggle('busy', busy);
        return;
      }

      if (e.data?.type !== 'initGraph') return;
      const { nodes, edges } = e.data;

      nodeById = new Map(nodes.map(n => [n.id, n]));
      childrenOf = new Map();
      parentOf = new Map();
      for (const e2 of edges) {
        if (!childrenOf.has(e2.from)) childrenOf.set(e2.from, []);
        childrenOf.get(e2.from).push(e2.to);
        parentOf.set(e2.to, e2.from);
      }
      expandedDirs = new Set();
      visibleCount = new Map();
      labelsHidden = false;

      // Start collapsed to just the root instead of dumping the whole tree
      // — a 30-node graph opening at full breadth is unreadable regardless
      // of layout. showChildren() (same paginated logic a click uses)
      // reveals the root's first page of children below.
      const rootNode = nodes.find(n => (n.depth ?? 0) === 0);
      allNodes = new vis.DataSet(rootNode ? [toVisNode(rootNode)] : []);
      allEdges = new vis.DataSet([]);
      if (rootNode) {
        expandedDirs.add(rootNode.id);
        showChildren(rootNode.id);
      }

      const options = {
        layout: {
          hierarchical: {
            enabled: true,
            direction: 'UD',
            sortMethod: 'directed',
            nodeSpacing: 110,
            levelSeparation: 120,
            treeSpacing: 70,
          },
        },
        physics: false,
        interaction: {
          hover: true,
          tooltipDelay: 300,
          zoomView: true,
          dragView: true,
        },
        nodes: { borderWidthSelected: 2 },
        edges: { selectionWidth: 2 },
      };

      // A fresh tree (new repo) should show the hint again until a node
      // in *this* graph gets selected.
      document.getElementById('hint').classList.remove('hidden');

      if (network) network.destroy();
      network = new vis.Network(
        document.getElementById('graph'),
        { nodes: allNodes, edges: allEdges },
        options
      );
      network.on('click', (params) => {
        if (busy || !params.nodes.length) return;
        // The empty-state hint only used to hide on a *file* click — expand
        // a folder instead (the far more common first action) and it sat
        // there, centered, for the rest of the session, drawn on top of
        // whatever the graph grew into underneath it. Any click on the
        // graph means the user found it; dismiss it right away regardless
        // of what kind of node they hit.
        document.getElementById('hint').classList.add('hidden');
        const nodeId = params.nodes[0];

        if (nodeId.startsWith('__more__:')) {
          showChildren(nodeId.slice('__more__:'.length));
          fitWhenReady(true);
          return;
        }

        const node = nodeById.get(nodeId);
        if (!node) return;
        if (node.group === 'dir') {
          toggleDir(nodeId);
          return;
        }
        window.parent.postMessage({ type: 'nodeClick', id: nodeId }, '*');
      });

      network.on('zoom', applyLabelVisibility);

      // No animation here: this runs unattended right after the graph
      // loads, not in response to a click, so there's no reason to risk
      // vis's animation stalling if the tab happens to be backgrounded at
      // that exact moment (its tween loop is itself rAF-driven, which
      // pauses in hidden tabs same as fitWhenReady's own polling would).
      fitWhenReady(false);
    });

    // network only fires its 'zoom' event for user-driven wheel/pinch zoom,
    // not for programmatic moveTo() — so the label-hide threshold has to be
    // re-checked by hand after every button-driven zoom too.
    document.getElementById('zoomIn').addEventListener('click', () => {
      if (!network) return;
      network.moveTo({ scale: network.getScale() * 1.3 });
      applyLabelVisibility();
    });
    document.getElementById('zoomOut').addEventListener('click', () => {
      if (!network) return;
      network.moveTo({ scale: network.getScale() / 1.3 });
      applyLabelVisibility();
    });
    document.getElementById('zoomReset').addEventListener('click', () => {
      if (!network) return;
      fitToNodes(true); // handles its own label-visibility recheck
    });
  </script>
</body>
</html>
